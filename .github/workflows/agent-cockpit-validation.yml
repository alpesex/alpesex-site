name: Agent cockpit validation (no deployment)
on:
  push:
    branches: [feature/agent-cockpit, feature/agent-cockpit-automation]
    paths: ['admin-agents/**', 'server/**', 'scripts/deploy-agent-coordinator.sh', 'scripts/deploy-agent-automation.sh', 'scripts/activate-agent-coordinator.sh', 'scripts/disable-agent-coordinator.sh', 'scripts/rollback-agent-coordinator.sh', 'scripts/rollback-agent-automation.sh', '.well-known/**', '.github/workflows/agent-cockpit-validation.yml']
  pull_request:
    paths: ['admin-agents/**', 'server/**', 'scripts/deploy-agent-coordinator.sh', 'scripts/deploy-agent-automation.sh', 'scripts/activate-agent-coordinator.sh', 'scripts/disable-agent-coordinator.sh', 'scripts/rollback-agent-coordinator.sh', 'scripts/rollback-agent-automation.sh', '.well-known/**', '.github/workflows/agent-cockpit-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-24.04
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable-test-password
          MARIADB_DATABASE: alpesex_test_agents
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: alpesex_test_agents
      DB_USERNAME: root
      DB_PASSWORD: disposable-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Syntaxe et tests du cockpit
        run: |
          php -l server/src/AgentCockpit/Gateway.php
          php -l server/src/AgentCockpit/OAuth.php
          php -l server/src/AgentCockpit/CoordinatorWake.php
          php -l server/src/Mail/TransactionalMailer.php
          php -l server/public/api/admin/agents/mcp/index.php
          php -l server/public/api/admin/agents/oauth/index.php
          php -l server/public/api/admin/agents/index.php
          php -l server/bin/archive-agent-test.php
          php -l server/bin/revoke-agent-tokens.php
          php -l server/bin/backup-agent-database.php
          bash -n scripts/deploy-agent-coordinator.sh
          bash -n scripts/deploy-agent-automation.sh
          bash -n scripts/activate-agent-coordinator.sh
          bash -n scripts/disable-agent-coordinator.sh
          bash -n scripts/rollback-agent-coordinator.sh
          bash -n scripts/rollback-agent-automation.sh
          php server/tests/agent-cockpit-gateway.php
          php server/tests/coordinator-wake.php
          node --check admin-agents/agents.js
          node admin-agents/tests/cockpit.smoke.mjs
      - name: Parcours HTTP OAuth et MCP local
        run: |
          composer install --working-dir=server --no-interaction --no-progress
          mkdir -p "$RUNNER_TEMP/alpesex-web" "$RUNNER_TEMP/alpesex-private"
          ln -s "$GITHUB_WORKSPACE/server/public/api" "$RUNNER_TEMP/alpesex-web/api"
          printf '%s\n' 'DB_HOST=127.0.0.1' 'DB_PORT=3306' 'DB_NAME=alpesex_test_agents' \
            'DB_USERNAME=root' 'DB_PASSWORD=disposable-test-password' \
            'ALPESEX_ADMIN_EMAILS=alpes.ex.asm@gmail.com' 'ALPESEX_MCP_ENABLED=1' \
            'ALPESEX_MCP_REDIRECT_URIS=https://chatgpt.com/connector_platform_oauth_redirect' \
            > "$RUNNER_TEMP/alpesex-private/.env"
          printf '%s\n' '<?php session_name("ALPESEXSESSID"); session_start(); $_SESSION["user_id"]=1; echo "OK";' \
            > "$RUNNER_TEMP/alpesex-web/session-fixture.php"
          ALPESEX_APP_DIR="$GITHUB_WORKSPACE/server" ALPESEX_PRIVATE_DIR="$RUNNER_TEMP/alpesex-private" \
            php -S 127.0.0.1:18765 -t "$RUNNER_TEMP/alpesex-web" > "$RUNNER_TEMP/alpesex-php.log" 2>&1 &
          node server/tests/agent-cockpit-http.mjs
