name: CPMP mobile validation (no deployment)
on:
  pull_request:
    paths: ['desktop/**', 'mobile/**', 'application/**', 'server/**', '.github/workflows/mobile-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-and-server:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable-test-password
          MARIADB_DATABASE: cpmp_test_mobile
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: cpmp_test_mobile
      DB_USERNAME: root
      DB_PASSWORD: disposable-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: mobile
      - run: npx playwright install --with-deps chromium && npm run test:ui
        working-directory: mobile
      - run: php -l server/public/api/application/index.php && php -l server/src/Application/ApplicationAccess.php && php server/tests/application.php
      - run: python3 server/tests/integration.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci && npm run sync
        working-directory: mobile
      - run: bash gradlew assembleDebug bundleRelease
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: cpmp-android-test-only
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: xcodebuild -version
      - run: npm ci && npm run sync
        working-directory: mobile
      - run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios/App
      - uses: actions/upload-artifact@v4
        with:
          name: cpmp-ios-simulator-test-only
          path: mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: desktop
      - run: npm run smoke
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: cpmp-windows-v6.0.0
          path: desktop/dist/*.exe
